<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ToDo</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <div class="container px-5 py-5">
      <h1>Note-Vote</h1>
      <div class="accordion shadow" id="accordion">
        <div class="accordion-item">
          <h2 class="accordion-header">
            <button
              class="accordion-button"
              data-bs-toggle="collapse"
              data-bs-target="#collapseOne"
              aria-expanded="true"
              aria-controls="collapseOne"
              type="button"
              value="logged-in"
              id="logged-in-as"
            >
            </button>
          </h2>
          <div
            id="collapseOne"
            class="accordion-collapse collapse show add-padding"
            data-bs-parent="#accordion"
          >
            <div class="accordion-body">
              <div class="to-center">
                <div class="dropdown">
                  <button
                    class="btn btn-primary dropdown-toggle"
                    type="button"
                    id="switch-user"
                    data-bs-toggle="dropdown"
                    aria-expanded="false"
                  >
                    Switch User
                  </button>

                  <div id="user-dropdown" class="dropdown-menu">
                    <button class="dropdown-item" data-id="0">User A</button>
                    <button class="dropdown-item" data-id="1">User B</button>
                    <button class="dropdown-item" data-id="2">User C</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="spacer"></div>
      <div class="container-sm">
        <div class="note-div" id="note-container">
          <div class="note-area shadow p-3 rounded">
            <ul class="list-group" id="list-group"></ul>
            <div class="note-div my-1">
              <input
                type="text"
                id="to-upload"
                class="form-control"
                placeholder="this is a note you submitted"
              />
              <button type="button" class="btn btn-outline-success ms-1" id="upload-btn">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="16"
                  height="16"
                  fill="currentColor"
                  class="bi bi-arrow-up"
                  viewBox="0 0 16 16"
                >
                  <path
                    fill-rule="evenodd"
                    d="M8 15a.5.5 0 0 0 .5-.5V2.707l3.146 3.147a.5.5 0 0 0 .708-.708l-4-4a.5.5 0 0 0-.708 0l-4 4a.5.5 0 1 0 .708.708L7.5 2.707V14.5a.5.5 0 0 0 .5.5"
                  />
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"></script>
  <script src="../js/script.js"></script>
</html>
