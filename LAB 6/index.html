<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="css\style.css" />
    <title>To Do List</title>
  </head>
  <body>
    <div class="container px-5 py-5">
      <h1>Note-Vote</h1>
      <div class="accordion shadow" id="form-accordion">
        <div class="accordion-item">
          <h2 class="accordion-header">
            <button
              class="accordion-button"
              data-bs-toggle="collapse"
              data-bs-target="#collapseOne"
              aria-expanded="true"
              aria-controls="collapseOne"
              type="button"
              value="Log In"
            >
              Log In
            </button>
          </h2>
          <div
            id="collapseOne"
            class="accordion-collapse collapse show add-padding"
            data-bs-parent="#form-accordion"
          >
            <div class="accordion-body">
              <h2>Log In</h2>
              <form>
                <div class="input-div">
                  <label for="email" class="form-label">Email Address</label>
                  <input
                    type="email"
                    class="form-control"
                    name="email"
                    id="email"
                    placeholder="Email Address"
                  />
                </div>
                <div class="input-div">
                  <label for="password" class="form-label">Password</label>
                  <input
                    type="password"
                    class="form-control"
                    name="password"
                    id="email"
                    placeholder="Password"
                  />
                </div><br/>
                <div class="to-center">
                  <button type="button" class="btn btn-primary" value="Log In">
                    <a href="pages/todo.html">Log In</a>
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
        <div class="accordion-item">
          <h2 class="accordion-header">
            <button
              class="accordion-button"
              data-bs-toggle="collapse"
              data-bs-target="#collapseTwo"
              aria-expanded="true"
              aria-controls="collapseOne"
              type="button"
              value="Log In"
            >
              Register
            </button>
          </h2>
          <div
            id="collapseTwo"
            class="accordion-collapse collapse add-padding"
            data-bs-parent="#form-accordion"
          >
            <div class="accordion-body">
              <h2>Sign Up</h2>
              <form>
                <div class="input-div">
                  <label for="sign-up-email" class="form-label"
                    >Email Address</label
                  >
                  <input
                    type="email"
                    class="form-control"
                    name="email"
                    id="sign-up-email"
                    placeholder="Email Address"
                  />
                </div>
                <div class="input-div">
                  <label for="sign-up-password" class="form-label"
                    >Password</label
                  >
                  <input
                    type="password"
                    class="form-control"
                    name="password"
                    id="sign-up-password"
                    placeholder="Password"
                  />
                </div>
                <div class="input-div">
                  <label for="inv-code" class="form-label">Invite Code</label>
                  <input
                    type="text"
                    id="inv-code"
                    placeholder="Invite Code"
                    name="invite-code"
                    class="form-control"
                  />
                </div><br/>
                <div class="to-center">
                  <button type="button" class="btn btn-primary" value="Log In">
                    <a href="pages/todo.html">Sign Up</a>
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"></script>
  </body>
</html>
