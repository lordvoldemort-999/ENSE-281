<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burn After Reading</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div class="container px-5 py-5">
        <h1>Burn After Reading</h1>
        <div class="container-sm px-3">
            <div class="card" id="card-1">
                <div class="card-body">
                    <h4 class="card-title" id="card-1-title">Buy Oat Milk</h4>
                    <p class="card-text" id="card-1-text">The oatier the better!</p>
                </div>
            </div>
            <div class="card" id="card-2">
                <div class="card-body">
                    <h4 class="card-title">Complete Lab 3</h4>
                    <p class="card-text">Hand it in by midnight</p>
                </div>
            </div>
        </div>
        <div class="px-3 mt-5">
            <div class="card py-3">
                <div class="input-form">
                    <form action="">
                        <div class="mb-3">
                            <input type="text" class="form-control" id="title" placeholder="Enter the note title here"/>
                        </div>
                        <div class="mb-3">
                            <textarea type="text" class="form-control" rows="3" id="content" placeholder="Write something here..."></textarea>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"></script>
    <script src="./js/script.js"></script>
</body>
</html>
